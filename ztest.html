<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>--WebKitCoding--</title>

    <style>

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Acme;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: url(mainbg.jpg) no-repeat;
    background-size: cover;
}

body::after {
    position: absolute;
    content: '';
    min-height: inherit;
    width: 100%;
    background-color: #0a2130;
    z-index: -1;
    opacity: 0.8;
}

.wrapper {
    position: relative;
    height: 650px;
    width: 550px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 800px;
}

.card {
    position: relative;
    height: 100%;
    width: 90%;
    text-align: center;
    transition: 0.2s ease-out;
    transition-delay: 0.3s;
}

.wrapper:hover .card {
    transform: rotateX(30deg);
    transform-origin: bottom;
    filter: brightness(30%);
    height: 95%;
}

.card img {
    height: inherit;
    width: inherit;
    border: 3px solid #fff;
    border-radius: 15px;
    object-fit: cover;
}

.card p {
    position: absolute;
    bottom: 8%;
    left: 15%;
    font-size: 2.5em;
    color: #fff;
    letter-spacing: 1px;
}

.popup {
    position: absolute;
    height: inherit;
    width: inherit;
}

.popup img {
    position: absolute;
    height: 80%;
    top: 50%;
    left: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7);
    transition: 0.2s ease-out;
    transition-delay: 0s;
}

.wrapper:hover .popup img {
    transform: translate(-50%, -50%) scale(1.2);
    transition-delay: 0.2s;
    opacity: 1;
}
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="card">
            <img src="bg-img.jpg" alt="">
        </div>

        <div class="popup">
            <img src="bg-removed.png" alt="">
        </div>
    </div>
</body>
</html>
